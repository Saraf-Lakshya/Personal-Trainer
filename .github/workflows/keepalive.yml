name: Supabase Keep-Alive

# Supabase free-tier projects pause after ~7 days of no activity. This job
# pings the database on a schedule so the project stays awake even during
# stretches where the app isn't opened (travel, deload weeks, injury, etc.).

on:
  schedule:
    # Every day at 09:00 UTC. Daily gives a wide safety margin against the
    # 7-day pause window — several runs can fail before the project is at risk.
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase secrets are not configured on this repo."
            exit 1
          fi

          # A real query against the database counts as activity. RLS may return
          # an empty result for the anon role — that's fine; the query still
          # executes in Postgres, which is what resets the inactivity clock.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/sessions?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "Supabase responded with HTTP $status"

          if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
            echo "Keep-alive ping succeeded."
          else
            echo "::error::Unexpected status $status — the project may be paused or the key invalid."
            exit 1
          fi
